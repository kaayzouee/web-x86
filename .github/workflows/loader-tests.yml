name: Loader browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.56.1
      - name: Test loading screen
        run: npx playwright test
      - name: Save screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loader-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload loader layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loader-layout-previews
          path: |
            test-results/**/layout-*.png
            test-results/**/visual-audit.json
          if-no-files-found: ignore
